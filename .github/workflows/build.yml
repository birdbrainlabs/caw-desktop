name: Build

on:
  push:
    branches: [master]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  linux:
    runs-on: ubuntu-24.04
    env:
      # Linked against glibc 2.31 with zig, so the release runs on Ubuntu 20.04,
      # Debian 11 and newer, whatever runner image builds it.
      TARGET: x86_64-unknown-linux-gnu
      GLIBC: "2.31"
    steps:
      - uses: actions/checkout@v4
      - uses: mlugg/setup-zig@v2
        with:
          version: 0.14.1
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-zigbuild,cargo-deb
      - name: Test
        run: cargo test --locked
      - name: Build
        run: cargo zigbuild --release --locked --target "$TARGET.$GLIBC"
      - name: Check the glibc it needs
        run: |
          need=$(objdump -T "target/$TARGET/release/caw-desktop" | grep -o 'GLIBC_[0-9.]*' | sed 's/GLIBC_//' | sort -uV | tail -1)
          echo "needs glibc $need"
          [ "$(printf '%s\n' "$need" "$GLIBC" | sort -V | tail -1)" = "$GLIBC" ]
      - name: End-to-end test
        run: scripts/e2e.sh "target/$TARGET/release"
      - name: Headless mode test
        run: scripts/headless-test.sh "target/$TARGET/release"
      # Types into a real X11 window and moves the pointer, on a virtual screen.
      # -noreset: Xvfb otherwise resets when the last client of one test disconnects,
      # and the next test's connection can land mid-reset.
      - name: Real keyboard and mouse test (X11)
        run: xvfb-run -a -s "-screen 0 1280x1024x24 -noreset" cargo test --release --locked -- --ignored --test-threads=1
      - name: Package
        run: |
          mkdir -p dist
          cp "target/$TARGET/release/caw-desktop" "target/$TARGET/release/caw-fake-phone" README.md PROTOCOL.md LICENSE ART-LICENSE.md dist/
          tar -czf caw-desktop-linux-x86_64.tar.gz -C dist .
          cargo deb --no-build --locked --target "$TARGET" --output caw-desktop-linux-x86_64.deb
      # Installs the .deb on the oldest and newest distros it's meant for, then removes it.
      - name: Install test (.deb)
        run: |
          for image in ubuntu:20.04 debian:12 ubuntu:24.04; do
            docker run --rm -v "$PWD:/w:ro" "$image" sh -ec '
              apt-get update -qq && apt-get install -y -qq --no-install-recommends /w/caw-desktop-linux-x86_64.deb >/dev/null
              caw-desktop --version
              test -f /etc/xdg/autostart/caw-desktop.desktop && test -f /usr/share/applications/caw-desktop.desktop
              apt-get purge -y -qq caw-desktop >/dev/null && ! test -e /usr/bin/caw-desktop'
          done
      - uses: actions/upload-artifact@v4
        with:
          name: caw-desktop-linux-x86_64
          path: |
            caw-desktop-linux-x86_64.tar.gz
            caw-desktop-linux-x86_64.deb
      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            caw-desktop-linux-x86_64.tar.gz
            caw-desktop-linux-x86_64.deb

  # The full app (dictation, tray, receiver, windows) for Ubuntu 24.04 and newer:
  # built on 24.04 against its GTK 4, with the speech model packed into the .deb.
  app:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Libraries
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends libgtk-4-dev libasound2-dev pkg-config >/dev/null
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-deb
      - name: Test
        run: cargo test --locked --features app-base
      - name: Build
        run: cargo build --release --locked --features app-base
      - name: Speech model
        run: scripts/fetch-model.sh target/model
      - name: Transcribe the model's test recordings
        run: |
          for wav in target/model/test_wavs/0.wav target/model/test_wavs/1.wav; do
            CAW_MODEL_DIR=target/model/moonshine-base-en target/release/caw-desktop dictate --file "$wav" | tee /tmp/out.txt
            grep '^typed:' /tmp/out.txt
          done
          cat target/model/test_wavs/trans.txt
      - name: Package
        run: |
          cargo deb --variant app --no-build --locked --output caw-desktop-app-linux-x86_64.deb
          dpkg-deb -I caw-desktop-app-linux-x86_64.deb
          dpkg-deb -c caw-desktop-app-linux-x86_64.deb
          ls -l caw-desktop-app-linux-x86_64.deb
      - uses: actions/upload-artifact@v4
        with:
          name: caw-desktop-app-linux-x86_64
          path: |
            caw-desktop-app-linux-x86_64.deb
            target/model/test_wavs/
      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: caw-desktop-app-linux-x86_64.deb

  # The app .deb on a headless GNOME desktop in Ubuntu containers: apt install
  # (as an upgrade from the 0.3.0 receiver package, with a phone paired), then
  # the app's start, tray icon, talk key (GlobalShortcuts portal), dictation and
  # typing. See scripts/gnome/test.sh.
  gnome:
    needs: [linux, app]
    strategy:
      fail-fast: false
      matrix:
        image: ["ubuntu:24.04", "ubuntu:26.04"]
    runs-on: ubuntu-24.04
    container:
      image: ${{ matrix.image }}
      options: --shm-size=1g
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: caw-desktop-app-linux-x86_64
          path: dist
      - uses: actions/download-artifact@v4
        with:
          name: caw-desktop-linux-x86_64
          path: dist
      - name: Test on GNOME
        timeout-minutes: 25
        run: scripts/gnome/test.sh dist
      - name: Logs
        if: always()
        run: for f in /tmp/gnome-logs/*.log; do [ -f "$f" ] || continue; echo "::group::$f"; cat "$f"; echo "::endgroup::"; done
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: gnome-test-${{ strategy.job-index }}
          path: /tmp/gnome-logs/
          if-no-files-found: ignore

  windows:
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - name: Test
        run: cargo test --locked
      - name: Build
        run: cargo build --release --locked
      - name: End-to-end test
        run: scripts/e2e.sh
      # Moves the real mouse and types into a real text box on the runner's desktop.
      - name: Real keyboard and mouse test
        run: cargo test --release --locked -- --ignored --test-threads=1
      - name: Package
        shell: pwsh
        run: |
          New-Item -ItemType Directory dist | Out-Null
          Copy-Item target/release/caw-desktop.exe, target/release/caw-fake-phone.exe, README.md, PROTOCOL.md, LICENSE, ART-LICENSE.md, "windows/Pair phone.cmd" dist/
          Compress-Archive -Path dist/* -DestinationPath caw-desktop-windows-x86_64.zip
      - uses: actions/upload-artifact@v4
        with:
          name: caw-desktop-windows-x86_64
          path: caw-desktop-windows-x86_64.zip
      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: caw-desktop-windows-x86_64.zip

  # Unsigned build and tests. The signed, notarized app is built on a Mac with
  # scripts/release-mac.sh and attached to the release by hand.
  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Add the Intel target
        run: rustup target add x86_64-apple-darwin
      - name: Test
        run: cargo test --locked
      - name: Build
        run: cargo build --release --locked
      - name: Build for Intel Macs
        run: cargo build --release --locked --bin caw-desktop --target x86_64-apple-darwin
      - name: End-to-end test
        run: scripts/e2e.sh
      - name: Headless mode test (Caw for Mac's helper)
        run: scripts/headless-test.sh
