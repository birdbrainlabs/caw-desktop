[package]
name = "caw-desktop"
version = "0.4.0"
edition = "2021"
description = "Types text dictated in the Caw phone app into the focused window"
license = "MIT"
repository = "https://github.com/birdbrainlabs/caw-desktop"
readme = "README.md"
keywords = ["dictation", "speech-to-text", "remote-input", "touchpad", "windows"]

[lib]
name = "caw_desktop"
path = "src/lib.rs"

[[bin]]
name = "caw-desktop"
path = "src/main.rs"

[[bin]]
name = "caw-fake-phone"
path = "src/bin/caw-fake-phone.rs"

[dependencies]
anyhow = "1"
base64 = "0.22"
dirs = "5"
futures = "0.3"
gethostname = "0.5"
hmac = "0.12"
mdns-sd = "0.13"
regex = "1"
qrcode = { version = "0.14", default-features = false }
rand = "0.8"
rcgen = { version = "0.13", default-features = false, features = ["crypto", "ring"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "logging"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
socket2 = "0.5"
sha2 = "0.10"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "io-util", "io-std", "time", "process", "sync", "signal"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring"] }
tokio-util = { version = "0.7", features = ["codec"] }
urlencoding = "2"
# Text clean-up after speech recognition (dictation); pure Rust.
fancy-regex = "0.19"
unicode-normalization = "0.1"

[features]
# Hold-to-talk dictation on this computer (Linux for now): `caw-desktop dictate`
# and `caw-desktop talk`. Speech recognition runs locally (Moonshine via sherpa-onnx).
dictation = ["dep:sherpa-onnx", "dep:cpal"]
# The desktop app, `caw-desktop app` (Linux): the receiver and dictation in one
# process, with a tray icon, a floating pill and GTK 4 windows for word fixes,
# pairing and settings. Needs GTK 4 (4.12 or later) and gtk4-layer-shell.
app = ["dictation", "dep:gtk", "dep:gtk4-layer-shell", "dep:ksni", "dep:async-channel"]

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = ["Win32_Foundation", "Win32_UI_Input_KeyboardAndMouse", "Win32_UI_WindowsAndMessaging"] }

[target.'cfg(target_os = "linux")'.dependencies]
ashpd = { version = "0.13", default-features = false, features = ["tokio", "remote_desktop", "screencast"] }
x11rb = { version = "0.13", features = ["xtest"] }
wayland-client = "0.31"
wayland-protocols-misc = { version = "0.3", features = ["client"] }
wayland-protocols-wlr = { version = "0.3", features = ["client"] }
libc = "0.2"
xkbcommon-dl = "0.4"
# Dictation only (feature "dictation"). sherpa-onnx links its static libraries,
# which its build script fetches once from the sherpa-onnx GitHub releases.
sherpa-onnx = { version = "=1.13.8", optional = true }
cpal = { version = "0.16", optional = true }
# The app only (feature "app").
gtk = { package = "gtk4", version = "0.11", optional = true, features = ["v4_12"] }
gtk4-layer-shell = { version = "0.8", optional = true }
ksni = { version = "0.3", optional = true }
async-channel = { version = "2", optional = true }

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-foundation = { version = "0.3", default-features = false, features = ["std", "NSString", "NSObject", "NSThread", "NSError", "NSDate", "NSNotification"] }
objc2-app-kit = { version = "0.3", default-features = false, features = ["std", "objc2-core-foundation", "NSApplication", "NSRunningApplication", "NSResponder", "NSStatusBar", "NSStatusItem", "NSStatusBarButton", "NSButton", "NSControl", "NSView", "NSMenu", "NSMenuItem", "NSCell", "NSImage", "NSEvent"] }
objc2-core-foundation = { version = "0.3", default-features = false, features = ["std", "CFCGTypes", "CFDictionary", "CFNumber", "CFString"] }
objc2-core-graphics = { version = "0.3", default-features = false, features = ["std", "CGEvent", "CGEventTypes", "CGEventSource", "CGRemoteOperation", "CGDirectDisplay", "CGError"] }
objc2-application-services = { version = "0.3", default-features = false, features = ["std", "HIServices", "AXUIElement"] }
objc2-service-management = { version = "0.3", default-features = false, features = ["std", "objc2", "objc2-foundation", "SMAppService"] }

# The .deb for Ubuntu, Debian and Linux Mint (`cargo deb`, see .github/workflows/build.yml):
# the receiver starts at login for every desktop user, and "Caw Desktop" in the
# apps menu shows the pairing code. caw-fake-phone is a dev tool and stays out.
[package.metadata.deb]
maintainer = "birdbrain labs <bird@birdbrainlabs.dev>"
copyright = "2026 birdbrain labs"
section = "utils"
priority = "optional"
# The release build targets glibc 2.31 (Ubuntu 20.04, Debian 11).
depends = "libc6 (>= 2.31)"
recommends = "xdg-utils"
suggests = "wtype"
extended-description = """\
You dictate into the Caw phone app; Caw Desktop types the text into whatever \
window is focused. The phone can also move the mouse, click, scroll and press \
keys and shortcuts. Speech recognition runs on the phone, and the phone and \
computer talk only over the local network."""
maintainer-scripts = "packaging/debian/"
assets = [
    ["target/release/caw-desktop", "usr/bin/", "755"],
    ["packaging/linux/caw-desktop.desktop", "usr/share/applications/", "644"],
    ["packaging/linux/caw-desktop-autostart.desktop", "etc/xdg/autostart/caw-desktop.desktop", "644"],
    ["README.md", "usr/share/doc/caw-desktop/", "644"],
]
