[package]
name = "caw-desktop"
version = "0.1.0"
edition = "2021"
description = "Types text dictated in the Caw phone app into the focused window"
license = "MIT"
repository = "https://github.com/birdbrainlabs/caw-desktop"
readme = "README.md"
keywords = ["dictation", "speech-to-text", "remote-input", "wayland", "touchpad"]

[lib]
name = "caw_desktop"
path = "src/lib.rs"

[[bin]]
name = "caw-desktop"
path = "src/main.rs"

[[bin]]
name = "caw-fake-phone"
path = "src/bin/caw-fake-phone.rs"

[dependencies]
anyhow = "1"
base64 = "0.22"
dirs = "5"
futures = "0.3"
gethostname = "0.5"
hmac = "0.12"
mdns-sd = "0.13"
regex = "1"
qrcode = { version = "0.14", default-features = false }
rand = "0.8"
rcgen = { version = "0.13", default-features = false, features = ["crypto", "ring"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "logging"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "io-util", "time", "process", "sync", "signal"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring"] }
tokio-util = { version = "0.7", features = ["codec"] }
urlencoding = "2"

[target.'cfg(target_os = "linux")'.dependencies]
wayland-client = "0.31"
wayland-protocols-wlr = { version = "0.3", features = ["client"] }
